<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>L2 Info TCG - Dashboard</title>
  <link rel="stylesheet" href="css/dashboard.css">
  
  <!-- Script de vérification de session -->
  <script>
    if (localStorage.getItem('isLoggedIn') !== 'true') {
      window.location.replace('login.html');
    }
  </script>
  <style>
    /* Grille de cartes adaptative */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 25px;
      width: 100%;
      margin-top: 20px;
    }

    /* Style Carte Full-Art */
    .tcg-card {
      position: relative;
      width: 240px;
      height: 350px;
      background-color: #0d1117;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
      display: flex;
      flex-direction: column;
      padding: 15px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      transition: transform 0.2s, border-color 0.2s;
      font-family: 'Fira Code', monospace;
    }

    .tcg-card:hover {
      transform: translateY(-5px);
      border-color: #58a6ff;
      box-shadow: 0 15px 35px rgba(88, 166, 255, 0.4);
    }

    /* L'image commence sous la ligne pointillée (environ 55px du haut) */
    .card-bg-image {
      position: absolute;
      top: 30px; 
      left: 0;
      width: 100%;
      height: calc(100% - 55px);
      object-fit: cover;
      z-index: 1;
    }

    /* Fond noir uni et net pour l'en-tête, s'arrête net aux pointillés */
    .card-header-info {
      position: relative;
      z-index: 3;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #0d1117;
      border-bottom: 2px dashed rgba(255, 255, 255, 0.3);
      padding-bottom: 8px;
      margin: -15px -15px 0 -15px;
      padding: 15px 15px 8px 15px;
    }

    /* Dégradé sombre uniquement en BAS pour faire ressortir les stats et la description */
    .tcg-card::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 60%;
      background: linear-gradient(to top, rgba(13, 17, 23, 0.95) 40%, rgba(13, 17, 23, 0.5) 75%, transparent);
      z-index: 2;
      pointer-events: none;
    }

    /* Les éléments du bas passent au premier plan */
    .card-stats, .card-desc {
      position: relative;
      z-index: 3;
    }

    .card-name {
      font-size: 1,05rem;
      font-weight: bold;
      color: #ffffff;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    .card-rarity {
      font-size: 0,65rem;
      padding: 3px 8px;
      border-radius: 4px;
      background-color: rgba(188, 140, 255, 0.25);
      color: #bc8cff;
      border: 1px solid #bc8cff;
      font-weight: bold;
    }

    /* Boîte des stats positionnée plus bas */
    .card-stats {
      position: absolute;
      bottom: 10px; /* Ajuste cette valeur pour monter ou descendre les stats */
      left: 15px;
      right: 15px;
      z-index: 3;
      display: flex;
      justify-content: space-between;
      background-color: rgba(13, 17, 23, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0,75rem;
      backdrop-filter: blur(4px);
    }

    .stat-cafe { color: #ffbd2e; font-weight: bold; }
    .stat-ects { color: #58a6ff; font-weight: bold; }

    /* Description placée juste au-dessus des stats */
    .card-desc {
      position: absolute;
      bottom: 48px; /* Se place directement au-dessus de la barre de stats */
      left: 12px;
      right: 12px;
      z-index: 3;
      font-size: 0.65rem;
      color: #c9d1d9;
      /*font-style: italic;*/
      
      font-family: sans-serif;
      line-height: 2;
      text-shadow: 0 1px 2px rgba(0,0,0,0.8);
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- Barre de navigation supérieure -->
    <header class="top-nav">
      <div class="nav-left">
        <div class="brand-logo">⚡ L2_TCG</div>
        <nav class="main-menu">
          <a href="index.html" class="active">ACCUEIL</a>
          <a href="shop.html">BOUTIQUE</a>
          <a href="collection.html">COLLECTION</a>
        </nav>
      </div>

      <div class="nav-right">
        <div class="user-profile">
          <span id="username-display">Étudiant</span>
          <div class="avatar-circle">💻</div>
        </div>
        <button id="logout-btn" title="Se déconnecter" class="btn-logout">LOGOUT</button>
      </div>
    </header>

    <!-- Sous-barre de navigation secondaire -->
    <div class="sub-nav">
      <div class="sub-menu-items">
        <a href="index.html" class="sub-item active"><span class="dot"></span> ACCUEIL</a>
        <a href="shop.html" class="sub-item">🛒 BOUTIQUE</a>
        <a href="collection.html" class="sub-item">📑 COLLECTION</a>
        <a href="trades.html" class="sub-item">🔄 ÉCHANGES</a>
        <a href="market.html" class="sub-item">📈 MARCHÉ</a>
        <a href="ranking.html" class="sub-item">🏆 CLASSEMENT</a>
      </div>
      <div class="sub-nav-right">
        <div class="currency-badge">
          <span class="currency-icon">🪙</span>
          <span id="ects-display">60</span> ECTS
        </div>
      </div>
    </div>

    <!-- Contenu Principal -->
    <main class="main-content" style="display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%;">
      <section class="booster-hero" style="display: flex; flex-direction: column; align-items: center; text-align: center; width: 100%;">
        <div class="hero-header">
          <span class="subtitle" id="timer-status">PROCHAIN BOOSTER DANS : 10:00</span>
          <h1 class="title-glow" id="booster-title-count">0 À OUVRIR</h1>
        </div>
        
        <!-- Visuel des boosters bien centré -->
        <div class="booster-display-area" style="display: flex; justify-content: center; margin: 20px 0;">
          <div class="booster-stack">
            <div class="booster-card layer-3"></div>
            <div class="booster-card layer-2"></div>
            <div class="booster-card layer-1">
              <div class="booster-badge" id="booster-badge-count">x0</div>
              <div class="booster-brand">L2 INFO TCG</div>
              <div class="booster-title">BOOSTER GRATUIT</div>
              <div class="booster-info">5 CARTES • RARE GARANTIE</div>
            </div>
          </div>
        </div>

        <!-- Boutons d'ouverture bleus -->
        <div class="action-container" style="display: flex; gap: 15px; justify-content: center;">
          <button id="btn-open-one" class="btn-open-booster">OUVRIR 1 BOOSTER</button>
          <button id="btn-open-all" class="btn-open-booster btn-secondary-action">TOUT OUVRIR</button>
        </div>
      </section>

      <!-- Zone d'affichage centrée pour les 5 cartes qui sortent au clic sur le bouton bleu -->
      <div id="stored-pull-results" style="display: flex; gap: 20px; margin-top: 35px; flex-wrap: wrap; justify-content: center; width: 100%; max-width: 1300px;"></div>
    </main>
  </div>

  <!-- Script global de gestion -->
  <script>
    const TIMER_DURATION = 10 * 60 * 1000; // 10 minutes
    const MAX_BOOSTERS = 6;

    if (localStorage.getItem('boosterCount') === null) {
      localStorage.setItem('boosterCount', '4');
    }
    if (localStorage.getItem('lastTimestamp') === null) {
      localStorage.setItem('lastTimestamp', Date.now().toString());
    }

    function calculateOfflineProgress() {
      let count = parseInt(localStorage.getItem('boosterCount'), 10);
      let lastTimestamp = parseInt(localStorage.getItem('lastTimestamp'), 10);
      let now = Date.now();

      if (isNaN(lastTimestamp)) {
        lastTimestamp = now;
        localStorage.setItem('lastTimestamp', now.toString());
      }

      if (count >= MAX_BOOSTERS) return;

      let elapsed = now - lastTimestamp;
      if (elapsed >= TIMER_DURATION) {
        let boostersGained = Math.floor(elapsed / TIMER_DURATION);
        count += boostersGained;

        if (count >= MAX_BOOSTERS) {
          count = MAX_BOOSTERS;
          localStorage.setItem('lastTimestamp', now.toString());
        } else {
          let newTimestamp = lastTimestamp + (boostersGained * TIMER_DURATION);
          localStorage.setItem('lastTimestamp', newTimestamp.toString());
        }

        localStorage.setItem('boosterCount', count.toString());
      }
    }

    function updateUI() {
      const count = parseInt(localStorage.getItem('boosterCount'), 10) || 0;
      document.getElementById('booster-title-count').textContent = `${count} À OUVRIR`;
      document.getElementById('booster-badge-count').textContent = `x${count}`;

      const btnOne = document.getElementById('btn-open-one');
      const btnAll = document.getElementById('btn-open-all');
      
      if (btnOne && btnAll) {
        btnOne.disabled = count === 0;
        btnAll.disabled = count === 0;
        btnOne.style.opacity = count === 0 ? '0.5' : '1';
        btnAll.style.opacity = count === 0 ? '0.5' : '1';
      }
    }

    function tick() {
      let count = parseInt(localStorage.getItem('boosterCount'), 10) || 0;
      let lastTimestamp = parseInt(localStorage.getItem('lastTimestamp'), 10);
      let now = Date.now();

      if (count >= MAX_BOOSTERS) {
        document.getElementById('timer-status').textContent = 'STOCK MAX ATTEINT (6/6)';
        return;
      }

      let elapsed = now - lastTimestamp;
      let remaining = TIMER_DURATION - elapsed;

      if (remaining <= 0) {
        calculateOfflineProgress();
        updateUI();
      } else {
        const minutes = Math.floor(remaining / (1000 * 60));
        const seconds = Math.floor((remaining % (1000 * 60)) / 1000);
        document.getElementById('timer-status').textContent = 
          `PROCHAIN BOOSTER DANS : ${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
      }
    }

    function getRarityConfig(rarete) {
      const r = (rarete || 'vulgaris').toLowerCase();
      const configs = {
        vulgaris:    { abbr: 'VUL', color: '#8b949e', bg: 'rgba(139, 148, 158, 0.2)', border: '#8b949e' },
        insolitus:   { abbr: 'INS', color: '#3fb950', bg: 'rgba(63, 185, 80, 0.2)',   border: '#3fb950' },
        rarus:       { abbr: 'RAR', color: '#58a6ff', bg: 'rgba(88, 166, 255, 0.2)',  border: '#58a6ff' },
        eximius:     { abbr: 'EXI', color: '#bc8cff', bg: 'rgba(188, 140, 255, 0.2)', border: '#bc8cff' },
        legendarius: { abbr: 'LEG', color: '#e3b341', bg: 'rgba(227, 179, 65, 0.2)',  border: '#e3b341' },
        mythicus:    { abbr: 'MYT', color: '#f85149', bg: 'rgba(248, 81, 73, 0.2)',   border: '#f85149' },
        arcanus:     { abbr: 'ARC', color: '#ffffff', bg: 'linear-gradient(45deg, #ff595e, #ffca3a, #8ac926, #1982c4, #6a4c93)', border: '#ffffff' }
      };
      return configs[r] || configs.vulgaris;
    }

    function createCardElement(card) {
      const style = getRarityConfig(card.rarete);
      const cardEl = document.createElement('div');
      cardEl.className = 'tcg-card';
      cardEl.style.borderColor = style.border;
    
      cardEl.innerHTML = `
        <div class="card-header-info">
          <span class="card-name">${card.nom}</span>
          <span class="card-rarity" style="background: ${style.bg}; color: ${style.color}; border-color: ${style.border};">
            ${style.abbr}
          </span>
        </div>
        <img src="${card.image}" alt="${card.nom}" class="card-bg-image">
        <p class="card-desc">// ${card.description || 'Pas de description.'}</p>
        <div class="card-stats">
          <span class="stat-cafe">☕ ${card.stats?.cafe || 0} Café</span>
          <span class="stat-ects">📜 ${card.stats?.ects || 0} ECTS</span>
        </div>
      `;
      return cardEl;
    }

    function displayPulledCards(cards) {
      const resultsContainer = document.getElementById('stored-pull-results');
      resultsContainer.innerHTML = `<h2 style="width: 100%; text-align: center; margin-top: 10px;">// ${cards.length} CARTES OBTENUES :</h2>`;
      
      cards.forEach(card => {
        resultsContainer.appendChild(createCardElement(card));
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('username-display').textContent = localStorage.getItem('username') || 'Étudiant';
      document.getElementById('ects-display').textContent = localStorage.getItem('ects') || '60';

      calculateOfflineProgress();
      updateUI();
      tick();
      setInterval(tick, 1000);

      document.getElementById('logout-btn').addEventListener('click', () => {
        localStorage.removeItem('isLoggedIn');
        localStorage.removeItem('username');
        localStorage.removeItem('ects');
        window.location.href = 'login.html';
      });

      // Ouvrir 1 booster
      document.getElementById('btn-open-one').addEventListener('click', async () => {
        let count = parseInt(localStorage.getItem('boosterCount'), 10) || 0;
        if (count > 0) {
          try {
            const response = await fetch('/api/open-stored-booster', { method: 'POST' });
            const data = await response.json();

            if (data.success) {
              if (count >= MAX_BOOSTERS) {
                localStorage.setItem('lastTimestamp', Date.now().toString());
              }
              count--;
              localStorage.setItem('boosterCount', count.toString());
              updateUI();
              tick();
              displayPulledCards(data.cards);
            } else {
              alert(data.error);
            }
          } catch (e) {
            console.error(e);
            alert("Erreur serveur.");
          }
        }
      });

      // Tout ouvrir
      document.getElementById('btn-open-all').addEventListener('click', async () => {
        let count = parseInt(localStorage.getItem('boosterCount'), 10) || 0;
        if (count > 0) {
          const totalBoostersToOpen = count;
          let allPulledCards = [];

          try {
            for (let i = 0; i < totalBoostersToOpen; i++) {
              const response = await fetch('/api/open-stored-booster', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: localStorage.getItem('username') })
              });
              const data = await response.json();
              if (data.success && data.cards) {
                allPulledCards = allPulledCards.concat(data.cards);
              }
            }

            localStorage.setItem('boosterCount', '0');
            localStorage.setItem('lastTimestamp', Date.now().toString());
            updateUI();
            tick();

            const resultsContainer = document.getElementById('stored-pull-results');
            resultsContainer.innerHTML = `<h2 style="width: 100%; text-align: center; margin-top: 10px;">// ${allPulledCards.length} CARTES OBTENUES (${totalBoostersToOpen} BOOSTERS OUVERTS) :</h2>`;
            
            // UTILISATION DE createCardElement POUR UN STYLE UNIFORME
            allPulledCards.forEach(card => {
              resultsContainer.appendChild(createCardElement(card));
            });

          } catch (e) {
            console.error(e);
            alert("Erreur lors de l'ouverture groupée.");
          }
        }
      });
    });
  </script>
</body>
</html>
